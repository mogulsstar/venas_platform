version: '3.8'

services:
  db:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=venas_platform
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin
      - MYSQL_ROOT_PASSWORD=rootpassword
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 10

  web:
    build: .
    command: gunicorn venas_platform.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=mysql://admin:admin@db:3306/venas_platform
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
      - SECRET_KEY=development-secret-key-change-in-production

  celery:
    build: .
    command: celery -A venas_platform worker -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=mysql://admin:admin@db:3306/venas_platform
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
      - SECRET_KEY=development-secret-key-change-in-production

  celery-beat:
    build: .
    command: celery -A venas_platform beat -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=mysql://admin:admin@db:3306/venas_platform
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
      - SECRET_KEY=development-secret-key-change-in-production

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:
